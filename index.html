<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open When 💌</title>

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a7b3b0.mp3" type="audio/mp3">
</audio>

<div class="container">

  <h1>open when you need me 💌</h1>

  <div class="menu" id="menu">
    <h2>choose a letter ✿</h2>

    <button onclick="openLock('miss')">💌 miss me</button>
    <button onclick="openLock('sad')">💔 sad</button>
    <button onclick="openLock('tired')">😴 tired</button>
    <button onclick="openLock('happy')">🎉 happy</button>
    <button onclick="openLock('proud')">🌿 proud</button>
    <button onclick="openLock('alone')">🌙 alone</button>
    <button onclick="openLock('secret')">???</button>
  </div>

  <!-- LETTER -->
  <div class="letter" id="letter">
    <div class="paper" id="paper"></div>
    <button onclick="back()">back</button>
  </div>

</div>

<!-- LOCKSCREEN -->
<div class="lockscreen" id="lockscreen">
  <div class="lockbox" id="lockbox">
    <h2>enter password</h2>
    <input type="password" id="lockinput">
    <button onclick="checkPassword()">unlock</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
