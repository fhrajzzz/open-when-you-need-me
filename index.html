<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open When 💌</title>

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<!-- 💌 floating envelopes -->
<div class="floating-env">
  <span>💌</span>
  <span>💌</span>
  <span>💌</span>
  <span>💌</span>
  <span>💌</span>
</div>

<!-- 🔐 LOCKSCREEN -->
<div class="lock" id="lock">
  <div class="box">
    <h2>enter password 💚</h2>
    <input type="password" id="pass" placeholder="••••••">
    <button onclick="unlock()">unlock</button>
    <p id="error"></p>
  </div>
</div>

<!-- MENU -->
<div class="container" id="container">

  <h1>open when you need me 💌</h1>

  <div class="menu" id="menu">
    <h2>choose a letter ✿</h2>

    <button onclick="openLetter('miss')">💌 miss me</button>
    <button onclick="openLetter('sad')">💔 sad</button>
    <button onclick="openLetter('tired')">😴 tired</button>
    <button onclick="openLetter('happy')">🎉 happy</button>
    <button onclick="openLetter('proud')">🌿 proud</button>
    <button onclick="openLetter('alone')">🌙 alone</button>
    <button onclick="openLetter('secret')">???</button>
  </div>

  <div class="letter" id="letter">
    <div class="paper" id="paper"></div>
    <button onclick="back()">back</button>
  </div>

</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a7b3b0.mp3">
</audio>

<audio id="unlockSound">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5c7a2b7c2d.mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
